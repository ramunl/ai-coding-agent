<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding Agent</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #8a8a90);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --accent: var(--tg-theme-button-color, #2a7ae2);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--hint); font-size: 13px; margin-top: 2px; word-break: break-all; }
  section { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 6px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .row span:first-child { color: var(--hint); flex-shrink: 0; }
  .row span:last-child { text-align: right; word-break: break-all; }
  .muted { color: var(--hint); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
           background: var(--accent); color: var(--tg-theme-button-text-color, #fff); }
  ol { margin: 0; padding-left: 20px; }
  li { padding: 2px 0; word-break: break-all; }
  a { color: var(--link); }
  pre { margin: 0; white-space: pre-wrap; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--hint); }
  #error { display: none; background: #fdecea; color: #8a1c1c; }
  footer { color: var(--hint); font-size: 12px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="project">Coding Agent</h1>
  <div class="sub" id="repo"></div>
</header>

<section id="error"></section>
<section><h2>Now</h2><div id="running"></div></section>
<section><h2>Queue</h2><div id="queue"></div></section>
<section><h2>Plan</h2><div id="plan"></div></section>
<section><h2>Last run</h2><div id="last"></div></section>
<section><h2>Providers</h2><div id="providers"></div></section>
<section><h2>Versions</h2><pre id="versions"></pre></section>
<footer id="updated">Loading…</footer>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const REFRESH_MS = 5000;

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (className) node.className = className;
    return node;
  }
  function row(label, value) {
    const node = el("div", null, "row");
    node.append(el("span", label), value instanceof Node ? value : el("span", value ?? "—"));
    return node;
  }
  function fill(id, ...children) { document.getElementById(id).replaceChildren(...children); }
  function openLink(url) {
    const link = el("a", url);
    link.href = url;
    link.addEventListener("click", (event) => {
      if (tg && tg.openLink) { event.preventDefault(); tg.openLink(url); }
    });
    return link;
  }

  function render(s) {
    document.getElementById("project").textContent = s.project ? s.project.name : "Coding Agent";
    document.getElementById("repo").textContent =
      s.project ? `${s.project.repository} [${s.project.branch}]` : "";

    if (s.running) {
      const status = el("span"); status.append(el("span", s.running.status || "RUNNING", "badge"));
      fill("running", row("Status", status), row("Branch", s.running.branch), row("Phase", s.running.phase));
    } else {
      fill("running", el("div", "Idle", "muted"));
    }

    const queue = s.queue || [];
    if (queue.length) {
      const list = el("ol");
      queue.forEach((t) => list.append(el("li", `#${t.id} ${t.branch} (${t.label})`)));
      fill("queue", list);
    } else {
      fill("queue", el("div", "Empty", "muted"));
    }

    const plan = [];
    if (s.pending_plan) {
      plan.push(row("Feature", s.pending_plan.feature),
                row("Revision", s.pending_plan.revision),
                row("Approved", s.pending_plan.approved ? "yes" : "no — /approve"));
    }
    if (s.pending_branch) plan.push(row("Ready to run", `${s.pending_branch} — /confirm`));
    if (s.awaiting_bugfix_answer) plan.push(row("Bugfix", "waiting for /answer"));
    fill("plan", ...(plan.length ? plan : [el("div", "Nothing pending", "muted")]));

    if (s.last_execution) {
      const e = s.last_execution;
      fill("last",
        row("Branch", e.branch),
        row("Tests", e.tests),
        row("Files", (e.files_changed || []).length),
        row("PR", e.pr_url ? openLink(e.pr_url) : "—"));
    } else {
      fill("last", el("div", "No runs yet", "muted"));
    }

    fill("providers",
      row("Planner", s.planning_agent),
      row("Implementer", s.implementation_agent),
      row("Verbosity", s.verbosity));

    document.getElementById("versions").textContent = [s.version, s.core].filter(Boolean).join("\n");
  }

  function showError(message) {
    const box = document.getElementById("error");
    box.textContent = message;
    box.style.display = message ? "block" : "none";
  }

  async function refresh() {
    const initData = tg ? tg.initData : "";
    if (!initData) {
      showError("Open this dashboard from the bot's Dashboard button in Telegram.");
      return;
    }
    try {
      const response = await fetch("api/state", { headers: { Authorization: "tma " + initData } });
      // A proxy error (e.g. Caddy's 502 while the bot restarts) is not JSON.
      const body = await response.json().catch(() => null);
      if (!response.ok || !body) {
        showError((body && body.error) || `The agent is not responding (HTTP ${response.status})`);
        return;
      }
      showError("");
      render(body);
      document.getElementById("updated").textContent =
        "Updated " + new Date().toLocaleTimeString() + " · refreshes every 5 s";
    } catch (error) {
      showError("Cannot reach the agent: " + error.message);
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
